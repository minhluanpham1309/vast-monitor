<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vast Monitor</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --line:#e3e6eb; --text:#1b1f24; --muted:#6a7380;
  --accent:#2f6fed; --run:#1f9d55; --idle:#8a94a3; --err:#d64545; --warn:#b7791f;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --logbg:#0f1318; --logtext:#d7dde5; --grid:#eceef2;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1216; --panel:#171b21; --line:#272d36; --text:#e6e9ee; --muted:#8b95a3;
    --accent:#5b8ef5; --logbg:#0a0d10; --grid:#232831; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 8px 0 0}
.sp{flex:1}
button,select,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--err)}
button.sm{padding:2px 8px;font-size:12px}
select,input{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 8px}
main{padding:18px 20px;max-width:1500px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.top{display:flex;align-items:center;gap:8px}
.name{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--muted);font-size:12px}
.mono{font-family:var(--mono);font-size:12px}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.b-running{background:color-mix(in srgb,var(--run) 15%,transparent);color:var(--run)}
.b-idle{background:color-mix(in srgb,var(--idle) 18%,transparent);color:var(--idle)}
.b-lost,.b-failed{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err)}
.b-stopped{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.b-done{background:color-mix(in srgb,var(--run) 15%,transparent);color:var(--run)}
.gpu{display:grid;grid-template-columns:22px 1fr 1fr;gap:6px;align-items:center;margin-top:6px;font-size:11px}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.bar.mem>i{background:var(--warn)}
.stats{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--text);font-weight:600}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.tabbar{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.tabbar button{border:0;background:transparent;padding:5px 12px;border-radius:6px;color:var(--muted)}
.tabbar button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.hctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.hctl .period{font-weight:600;min-width:180px;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.hbars{display:flex;align-items:flex-end;gap:2px;height:120px;padding-top:6px;position:relative}
.hbars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:default}
.hbars .b i{display:block;background:var(--accent);border-radius:4px 4px 0 0;min-height:0}
.hbars .b:hover i{opacity:.8}
.hlabels{display:flex;gap:2px;font-size:10.5px;color:var(--muted);margin-top:4px}
.hlabels span{flex:1;text-align:center;overflow:hidden;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:30;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(980px,100%);box-shadow:0 10px 40px rgba(0,0,0,.35)}
tr.selrow td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
tr.totrow td{border-top:2px solid var(--line);border-bottom:0}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font:inherit}
section.detail{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.dhead h2{margin:0;font-size:16px}
h3{font-size:12px;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:11.5px}
td.cmd{font-family:var(--mono);font-size:11.5px;word-break:break-all;min-width:240px}
.child{color:var(--muted)}
.links{display:flex;gap:4px;flex-wrap:wrap}
.kv{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px}
.kv span{color:var(--muted);margin-right:4px}
pre.log{background:var(--logbg);color:var(--logtext);font:12px/1.45 var(--mono);padding:12px;border-radius:8px;
  max-height:460px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.tabs button.on{border-color:var(--accent);color:var(--accent)}
.logbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.logbox input[type=text]{flex:1;min-width:220px;font-family:var(--mono);font-size:12px}
.run{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:10px}
.run .top{margin-bottom:4px}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:8px}
.chart{position:relative}
.chart .t{font-size:12px;display:flex;justify-content:space-between;color:var(--muted)}
.chart .t b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.chart svg{display:block;width:100%;height:90px;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:3px 7px;font-size:11.5px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.12);display:none;z-index:2}
.events li{font-size:12.5px;margin:3px 0}
.login{max-width:360px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
.login h2{margin:0 0 6px;font-size:17px}
.login input{width:100%;margin:12px 0}
.toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:20}
.toast div{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);padding:8px 12px;border-radius:8px;
  box-shadow:0 4px 18px rgba(0,0,0,.15);font-size:13px;max-width:380px}
@media (max-width:640px){ header{padding:10px 14px} main{padding:14px 12px} .grid{grid-template-columns:1fr}
  .charts{grid-template-columns:1fr 1fr} .chart svg{height:70px} .chart .sub{font-size:10.5px} }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

const S = { view: lsGet("vm.view", "live"), hist: null, charges: {}, hSel: new Set(), hDays: lsGet("vm.hdays", 7), sumOpen: false, hMode: lsGet("vm.hmode", "week"), hRef: Date.now(),
  token: lsGet("vm.token", ""), data: null, sel: lsGet("vm.sel", null), logTab: 0, watch: null,
  seenEvents: new Set(lsGet("vm.seen", [])), seenRes: new Set(), timer: null, err: "" };

async function api(path, opts = {}){
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", Authorization: "Bearer " + S.token } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401){ S.token = ""; lsSet("vm.token", ""); render(); throw new Error("Sai mật khẩu"); }
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg){ const el = document.createElement("div"); el.textContent = msg; $("#toast").appendChild(el); setTimeout(() => el.remove(), 6000); }
function fmtDur(s){
  if (s == null) return "–"; s = Math.max(0, Math.floor(s));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}n ${h}g` : h ? `${h}g ${m}p` : m ? `${m}p ${s % 60}s` : `${s}s`;
}
function fmtMB(mb){ if (mb == null) return "–"; return mb >= 1024 ? (mb / 1024).toFixed(1) + " GB" : Math.round(mb) + " MB"; }
function fmtBytes(b){ if (b == null) return "–"; if (b < 1024) return b + " B"; if (b < 1048576) return (b / 1024).toFixed(1) + " KB"; return fmtMB(b / 1048576); }
function fmtNum(v){ if (typeof v !== "number") return esc(v); const a = Math.abs(v);
  return Number.isInteger(v) ? String(v) : a >= 100 ? v.toFixed(1) : a >= 1 ? v.toFixed(3) : v.toPrecision(3); }
const now = () => S.data ? S.data.now + (Date.now() - S.fetchedAt) / 1000 : Date.now() / 1000;
const ago = ts => ts ? (now() - ts < 60 ? "vừa xong" : fmtDur(now() - ts) + " trước") : "";
const pct = (a, b) => b ? Math.min(100, a / b * 100) : 0;

function stateOf(m){
  const age = now() - m.last_seen;
  if (m.vast_status && m.vast_status !== "running") return ["stopped", "Đã dừng (" + m.vast_status + ")"];
  if (age > 180) return ["lost", "Mất liên lạc " + fmtDur(age)];
  return m.state === "running" ? ["running", "Đang chạy"] : ["idle", "Rảnh"];
}

// ------------------------------------------------------------ data
async function load(){
  try {
    const d = await api("/api/machines");
    S.data = d; S.fetchedAt = Date.now(); S.err = "";
    for (const e of d.events){
      const k = e.machine + e.at + (e.pid || e.run);
      if (!S.seenEvents.has(k)){
        S.seenEvents.add(k);
        if (S.loaded){
          const msg = evText(e); toast(msg);
          if ("Notification" in window && Notification.permission === "granted") new Notification("Vast Monitor", { body: msg });
        }
      }
    }
    lsSet("vm.seen", [...S.seenEvents].slice(-300));
    for (const m of d.machines) for (const r of m.cmd_results || []){
      if (!S.seenRes.has(r.cid)){ S.seenRes.add(r.cid); if (S.loaded) toast(`[${m.name}] ${r.msg}`); }
    }
    S.loaded = true;
    if (!S.sel && d.machines.length) S.sel = d.machines[0].id;
  } catch (e){ S.err = e.message; }
  render();
}
function schedule(){
  clearTimeout(S.timer);
  const watching = S.watch && S.watch.id === S.sel;
  S.timer = setTimeout(async () => { if (!document.hidden || watching){ if (watching) await sendWatch(); await load(); if (S.view === "history") await loadHistory(); } schedule(); },
    watching ? 5000 : 15000);
}
function evText(e){
  if (e.type === "run_end") return `[${e.name}] Run ${e.run}: ${e.status}${e.error ? " — " + e.error : ""}`;
  return `[${e.name}] Tiến trình ${e.pid} kết thúc sau ${fmtDur(e.etime)}`;
}

// ------------------------------------------------------------ render
function render(force){
  const app = $("#app");
  if (!force && document.activeElement?.tagName === "SELECT"){ S.dirty = true; return; }
  S.dirty = false;
  if (!S.token){
    app.innerHTML = `<form class="login" id="lf"><h2>Vast Monitor</h2><div class="sub">Nhập VIEW_TOKEN đã đặt trên Vercel.</div>
      <input type="password" id="tk" placeholder="VIEW_TOKEN" autofocus><button class="primary" style="width:100%">Vào</button></form>`;
    $("#lf").onsubmit = e => { e.preventDefault(); S.token = $("#tk").value.trim(); lsSet("vm.token", S.token); load(); schedule(); };
    return;
  }
  const keep = { y: window.scrollY, log: $("#logpre")?.scrollTop, stick: $("#logpre") ? isBottom($("#logpre")) : true,
    focus: document.activeElement?.id, val: $("#wTarget")?.value };
  const d = S.data;
  app.innerHTML = `<header><h1>Vast Monitor</h1>
    <div class="tabbar"><button data-view="live" class="${S.view === "live" ? "on" : ""}">Máy đang chạy</button><button data-view="history" class="${S.view === "history" ? "on" : ""}">Lịch sử thuê</button></div>
    <button id="bR">Làm mới</button>
    <span class="sub">${d ? "cập nhật " + ago(d.now) : ""}</span>${S.err ? `<span class="sub" style="color:var(--err)">${esc(S.err)}</span>` : ""}
    <span class="sp"></span><button id="bN">${"Notification" in window && Notification.permission === "granted" ? "🔔 Đang bật thông báo" : "Bật thông báo"}</button>
    <button id="bO" class="sm">Đăng xuất</button></header>
    <main>${S.view === "history" ? historyView() : d ? grid(d) + detail(d) + events(d) : `<div class="empty">Đang tải…</div>`}</main>`;
  bind();
  if (keep.val != null && $("#wTarget")) $("#wTarget").value = keep.val;
  if (keep.focus && $("#" + keep.focus)) $("#" + keep.focus).focus();
  const pre = $("#logpre"); if (pre) pre.scrollTop = keep.stick ? pre.scrollHeight : keep.log;
  window.scrollTo(0, keep.y);
}
const isBottom = el => el.scrollHeight - el.scrollTop - el.clientHeight < 40;

function grid(d){
  if (!d.machines.length) return `<div class="empty">Chưa có máy nào gửi dữ liệu.<br>Chạy agent trên máy vast (xem README) là máy tự hiện ở đây.</div>`;
  return `<div class="grid">${d.machines.map(m => {
    const [cls, label] = stateOf(m);
    const pids = new Set(m.procs.map(p => p.pid));
    const roots = m.procs.filter(p => !pids.has(p.ppid)).length;
    const runs = (m.runs || []).filter(r => r.status === "running").length;
    const gpus = (m.gpus || []).map(x => `<div class="gpu"><span class="mono">#${esc(x.index)}</span>
      <div class="bar" title="GPU ${x.util ?? "?"}%"><i style="width:${x.util || 0}%"></i></div>
      <div class="bar mem" title="VRAM ${fmtMB(x.mem_used)} / ${fmtMB(x.mem_total)}"><i style="width:${pct(x.mem_used, x.mem_total)}%"></i></div></div>`).join("");
    return `<div class="card ${S.sel === m.id ? "sel" : ""}" data-id="${esc(m.id)}">
      <div class="top"><span class="name">${esc(m.name)}</span><span class="badge b-${cls}">${esc(label)}</span></div>
      <div class="sub mono">${esc(m.instance_id ? "instance " + m.instance_id : m.hostname)}${m.public_ip ? " · " + esc(m.public_ip) : ""}</div>
      ${gpus ? `<div class="sub" style="margin-top:8px">${esc(m.gpus[0].name)} × ${m.gpus.length} · util / VRAM</div>${gpus}` : ""}
      <div class="stats"><span>Tiến trình <b>${roots}</b></span>${m.runs?.length ? `<span>Run đang chạy <b>${runs}</b></span>` : ""}
        <span>Uptime <b>${fmtDur(m.uptime_s)}</b></span><span>${ago(m.last_seen)}</span></div></div>`;
  }).join("")}</div>`;
}

function tree(procs){
  const ids = new Set(procs.map(p => p.pid)), out = [];
  const walk = (p, dpt) => { out.push({ ...p, depth: dpt }); procs.filter(q => q.ppid === p.pid).forEach(k => walk(k, dpt + 1)); };
  procs.filter(p => !ids.has(p.ppid)).forEach(p => walk(p, 0));
  return out;
}

function detail(d){
  const m = d.machines.find(x => x.id === S.sel);
  if (!m) return "";
  const [cls, label] = stateOf(m);
  let h = `<section class="detail"><div class="dhead"><h2>${esc(m.name)}</h2><span class="badge b-${cls}">${esc(label)}</span>
    <span class="sp"></span><button class="sm danger" id="bDel">Xoá khỏi dashboard</button></div>
    <div class="kv"><div><span>Host</span>${esc(m.hostname)}</div><div><span>Load</span>${(m.load || []).join(" ")}${m.ncpu ? ` (${m.ncpu} CPU)` : ""}</div>
    <div><span>RAM</span>${m.mem ? fmtMB(m.mem.used) + " / " + fmtMB(m.mem.total) : "–"}</div>
    ${(m.disks || []).map(x => `<div><span>Disk ${esc(x.mount)}</span>${fmtMB(x.used)} / ${fmtMB(x.total)}</div>`).join("")}
    <div><span>Gửi lần cuối</span>${ago(m.last_seen)} (chu kỳ ${m.interval}s)</div></div>`;

  if (m.runs?.length) h += `<h3>Run / metrics</h3>` + m.runs.map(runCard).join("");

  if (m.gpus?.length) h += `<h3>GPU</h3><div class="tw"><table><tr><th>#</th><th>Tên</th><th>Util</th><th>VRAM</th><th>Nhiệt</th><th>Công suất</th></tr>
    ${m.gpus.map(x => `<tr><td>${esc(x.index)}</td><td>${esc(x.name)}</td><td>${x.util ?? "–"}%</td><td>${fmtMB(x.mem_used)} / ${fmtMB(x.mem_total)}</td>
    <td>${x.temp ?? "–"}°C</td><td>${x.power != null ? Math.round(x.power) : "–"} / ${x.power_limit != null ? Math.round(x.power_limit) : "–"} W</td></tr>`).join("")}</table></div>`;

  const procs = tree(m.procs);
  h += `<h3>Tiến trình (${procs.length})</h3>` + (!procs.length ? `<div class="sub">Không có tiến trình nào khớp bộ lọc.</div>` :
    `<div class="tw"><table><tr><th>PID</th><th>Chạy được</th><th>CPU</th><th>RAM</th><th>Lệnh / thư mục</th><th></th></tr>
    ${procs.map(p => `<tr><td class="mono">${p.pid}</td><td>${fmtDur(p.etime)}</td><td>${p.cpu}%</td><td>${fmtMB(p.rss_mb)}</td>
      <td class="cmd"><span class="${p.depth ? "child" : ""}">${p.depth ? "↳ " : ""}${esc(p.cmd)}</span>
        ${p.cwd ? `<div class="sub">📁 ${esc(p.cwd)}</div>` : ""}</td>
      <td><div class="links">${p.log ? `<button class="sm" data-w="file" data-v="${esc(p.log)}">Log</button>` : ""}
        ${p.tmux ? `<button class="sm" data-w="tmux" data-v="${esc(p.tmux)}">tmux ${esc(p.tmux)}</button>` : ""}
        <button class="sm danger" data-kill="${p.pid}">Dừng</button></div></td></tr>`).join("")}</table></div>`);

  if (m.tmux?.length) h += `<h3>Phiên tmux</h3><div class="links">${m.tmux.map(t =>
    `<button class="sm" data-w="tmux" data-v="${esc(t.name)}">${esc(t.name)} · ${t.windows} cửa sổ</button>`).join("")}</div>`;

  // log: các nguồn agent tự gửi + nguồn đang "watch"
  const sources = (m.logs || []).map(l => ({ ...l, label: (l.kind === "tmux" ? "tmux " : "") + l.target.split("/").pop() }));
  const w = S.watch && S.watch.id === m.id ? S.watch : null;
  if (w){
    const wr = m.watch_result && m.watch_result.target === w.target ? m.watch_result : null;
    sources.unshift({ kind: w.kind, target: w.target, label: "👁 " + w.target.split("/").pop(), watch: true,
      text: wr ? wr.text : "Đang chờ agent gửi (tối đa 1 chu kỳ)…", mtime: wr?.mtime, size: wr?.size, at: wr?.at });
  }
  if (S.logTab >= sources.length) S.logTab = 0;
  const cur = sources[S.logTab];
  h += `<h3>Log</h3>${sources.length ? `<div class="tabs">${sources.map((s, i) =>
      `<button class="sm ${i === S.logTab ? "on" : ""}" data-tab="${i}" title="${esc(s.target)}">${esc(s.label)}</button>`).join("")}</div>` : ""}
    <div class="logbox">${pickerHTML(m, w)}
      <select id="wLines">${[200, 500, 1000, 3000].map(n => `<option ${n === (w?.lines || 200) ? "selected" : ""}>${n}</option>`).join("")}</select>
      <button class="sm primary" id="wGo">Theo dõi</button>${w ? `<button class="sm" id="wStop">Dừng theo dõi</button>` : ""}</div>
    ${cur ? `<div class="sub" style="margin-bottom:6px">${esc(cur.target)}${cur.mtime ? " · sửa " + ago(cur.mtime) +
      (now() - cur.mtime > 1800 ? " · ⚠ log đứng yên hơn 30 phút" : "") : ""}${cur.size != null ? " · " + fmtBytes(cur.size) : ""}
      ${cur.watch ? " · cập nhật 5s/lần" : " · 40 dòng cuối, gửi kèm mỗi chu kỳ"}</div>
      <pre class="log" id="logpre">${esc(cur.text || "(trống)")}</pre>` :
      `<div class="sub">Chưa có log. Chọn file log hoặc phiên tmux ở trên rồi bấm Theo dõi.</div>`}
  </section>`;
  return h;
}

function shortPath(p, cwd){
  if (cwd && p.startsWith(cwd + "/")) return p.slice(cwd.length + 1);
  const parts = p.split("/"); return parts.length > 4 ? "…/" + parts.slice(-3).join("/") : p;
}
function pickerHTML(m, w){
  const kind = S.wKind || w?.kind || "file";
  const cur = w?.target || "";
  let opts = "";
  if (kind === "file"){
    const files = m.log_files || [];
    const cwd = (m.procs.find(p => p.cwd && p.cwd !== "/") || {}).cwd;
    const live = files.filter(f => f.src !== "scan"), other = files.filter(f => f.src === "scan");
    const opt = f => `<option value="${esc(f.path)}" ${f.path === cur ? "selected" : ""} title="${esc(f.path)}">${f.src !== "scan" ? "● " : ""}${esc(shortPath(f.path, cwd))} · ${ago(f.mtime)} · ${fmtBytes(f.size)}</option>`;
    if (live.length) opts += `<optgroup label="Tiến trình đang ghi">${live.map(opt).join("")}</optgroup>`;
    if (other.length) opts += `<optgroup label="File log khác (3 ngày gần đây)">${other.map(opt).join("")}</optgroup>`;
    if (!files.length) opts += `<option value="" disabled selected>${m.log_files ? "Không tìm thấy file log" : "Agent cũ chưa gửi danh sách — chạy lại agent"}</option>`;
  } else {
    const sess = m.tmux || [], panes = m.tmux_panes || [];
    if (sess.length) opts += `<optgroup label="Phiên">${sess.map(t => `<option value="${esc(t.name)}" ${t.name === cur ? "selected" : ""}>${esc(t.name)} · ${t.windows} cửa sổ</option>`).join("")}</optgroup>`;
    if (panes.length > sess.length) opts += `<optgroup label="Pane">${panes.map(p => `<option value="${esc(p.target)}" ${p.target === cur ? "selected" : ""}>${esc(p.target)} · ${esc(p.cmd)}</option>`).join("")}</optgroup>`;

  }
  const custom = S.wCustom;
  return `<select id="wKind"><option value="file">File</option><option value="tmux" ${kind === "tmux" ? "selected" : ""}>tmux</option></select>

      : `<select id="wPick" style="flex:1;min-width:220px;max-width:100%">${opts}<option value="__custom">✎ Nhập đường dẫn khác…</option></select>`}`;

function runCard(r){
  const cls = r.status === "running" ? "running" : r.status === "done" ? "done" : "failed";
  const label = { running: "Đang chạy", done: "Xong", failed: "Lỗi", stopped: "Đã dừng" }[r.status] || r.status;
  const last = r.last ? Object.entries(r.last).filter(([k]) => !k.startsWith("_")) : [];
  const dur = r.started ? fmtDur((r.ended || now()) - r.started) : "";
  return `<div class="run"><div class="top"><span class="name mono">${esc(r.name)}</span><span class="badge b-${cls}">${esc(label)}</span></div>
    <div class="sub">${r.n} điểm · ${dur}${r.status === "running" ? " · cập nhật " + ago(r.updated) : ""}${r.error ? ` · <span style="color:var(--err)">${esc(r.error)}</span>` : ""}</div>
    ${last.length ? `<div class="kv" style="margin-top:6px">${last.map(([k, v]) => `<div><span>${esc(k)}</span>${fmtNum(v)}</div>`).join("")}</div>` : ""}
    ${Object.keys(r.series || {}).length ? `<div class="charts">${Object.entries(r.series).filter(([k, s]) => s.length > 1 && !/^(epoch|step|global_step|iter|iteration)$/i.test(k)).map(([k, s]) => chart(k, s)).join("")}</div>` : ""}
    ${r.config ? `<details style="margin-top:6px"><summary class="sub">Config</summary><pre class="mono" style="white-space:pre-wrap;margin:4px 0 0">${esc(JSON.stringify(r.config, null, 2))}</pre></details>` : ""}</div>`;
}

function chart(key, s){
  const W = 300, H = 90, P = 4;
  const xs = s.map(p => p[0]), ys = s.map(p => p[1]);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); if (y0 === y1){ y0 -= 1; y1 += 1; }
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  const sx = x => P + (x - x0) / ((x1 - x0) || 1) * (W - 2 * P), sy = y => H - P - (y - y0) / (y1 - y0) * (H - 2 * P);
  const d = s.map((p, i) => (i ? "L" : "M") + sx(p[0]).toFixed(1) + " " + sy(p[1]).toFixed(1)).join("");
  const grid = [0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${W}" y1="${(P + f * (H - 2 * P)).toFixed(1)}" y2="${(P + f * (H - 2 * P)).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`).join("");
  const lastY = ys[ys.length - 1];
  return `<div class="chart" data-series='${esc(JSON.stringify(s))}' data-key="${esc(key)}">
    <div class="t"><span>${esc(key)}</span><b>${fmtNum(lastY)}</b></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(key)}: ${s.length} điểm, giá trị cuối ${fmtNum(lastY)}">
      ${grid}<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      <line class="xh" y1="0" y2="${H}" stroke="var(--muted)" stroke-width="1" vector-effect="non-scaling-stroke" style="display:none"/>
    </svg><div class="sub" style="display:flex;justify-content:space-between"><span>min ${fmtNum(Math.min(...ys))}</span><span>max ${fmtNum(Math.max(...ys))}</span></div>
    <div class="tip"></div></div>`;
}

function bindCharts(){
  document.querySelectorAll(".chart").forEach(c => {
    const s = JSON.parse(c.dataset.series), svg = c.querySelector("svg"), tip = c.querySelector(".tip"), xh = c.querySelector(".xh");
    const xs = s.map(p => p[0]), x0 = Math.min(...xs), x1 = Math.max(...xs);
    svg.onmousemove = e => {
      const r = svg.getBoundingClientRect(), f = (e.clientX - r.left) / r.width, t = x0 + f * (x1 - x0);
      let best = 0; s.forEach((p, i) => { if (Math.abs(p[0] - t) < Math.abs(s[best][0] - t)) best = i; });
      const p = s[best], vx = 4 + (p[0] - x0) / ((x1 - x0) || 1) * 292;
      xh.setAttribute("x1", vx); xh.setAttribute("x2", vx); xh.style.display = "";
      tip.style.display = "block"; tip.innerHTML = `<b>${fmtNum(p[1])}</b> <span class="sub">${new Date(p[0] * 1000).toLocaleTimeString("vi-VN")}</span>`;
      tip.style.left = Math.min(r.width - tip.offsetWidth, Math.max(0, vx / 300 * r.width - tip.offsetWidth / 2)) + "px"; tip.style.top = "14px";
    };
    svg.onmouseleave = () => { tip.style.display = "none"; xh.style.display = "none"; };
  });
}

function events(d){
  if (!d.events.length) return "";
  return `<section class="events"><h3>Sự kiện gần đây</h3><ul>${d.events.slice(0, 20).map(e =>
    `<li><span class="sub">${new Date(e.at * 1000).toLocaleString("vi-VN")}</span> — ${esc(evText(e))}
     ${e.cmd ? `<span class="sub mono">${esc(e.cmd.slice(0, 100))}</span>` : ""}</li>`).join("")}</ul>
    <button class="sm" id="bClr">Xoá lịch sử</button></section>`;
}


// ------------------------------------------------------------ lịch sử thuê
async function loadHistory(){
  try { S.hist = await api("/api/history"); S.histAt = Date.now(); S.histErr = ""; } catch (e){ S.histErr = e.message; }
  if (S.view === "history") render(true);
}
function periodRange(mode, ref){
  const d = new Date(ref); d.setHours(0, 0, 0, 0);
  let from, to;
  if (mode === "day"){ from = new Date(d); to = new Date(d); to.setDate(to.getDate() + 1); }
  else if (mode === "week"){ from = new Date(d); from.setDate(d.getDate() - ((d.getDay() + 6) % 7)); to = new Date(from); to.setDate(to.getDate() + 7); }
  else if (mode === "ndays"){ to = new Date(d); to.setDate(to.getDate() + 1); from = new Date(to); from.setDate(from.getDate() - S.hDays); }
  else { from = new Date(d.getFullYear(), d.getMonth(), 1); to = new Date(d.getFullYear(), d.getMonth() + 1, 1); }
  return [from, to];
}
function periodLabel(mode, from, to){
  const f = x => x.toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric" });
  if (mode === "day") return from.toLocaleDateString("vi-VN", { weekday: "long", day: "2-digit", month: "2-digit", year: "numeric" });
  if (mode === "week"){ const e = new Date(to); e.setDate(e.getDate() - 1); return `Tuần ${f(from)} – ${f(e)}`; }
  if (mode === "ndays"){ const e = new Date(to); e.setDate(e.getDate() - 1); return S.hDays === 1 ? f(from) : `${S.hDays} ngày: ${f(from)} – ${f(e)}`; }
  return `Tháng ${from.getMonth() + 1}/${from.getFullYear()}`;
}
function shiftRef(dir){
  const d = new Date(S.hRef);
  if (S.hMode === "day") d.setDate(d.getDate() + dir);
  else if (S.hMode === "week") d.setDate(d.getDate() + 7 * dir);
  else if (S.hMode === "ndays") d.setDate(d.getDate() + S.hDays * dir);
  else { d.setDate(1); d.setMonth(d.getMonth() + dir); }
  S.hRef = d.getTime();
}
const nowSec = () => (S.hist ? S.hist.now + (Date.now() - S.histAt) / 1000 : Date.now() / 1000);
function segsOf(h){
  // đoạn cuối của máy còn sống kéo tới hiện tại (bản ghi chỉ cập nhật 5 phút/lần)
  const segs = h.segs.map(x => x.slice());
  if (!h.ended && Date.now() / 1000 - h.last_seen < 600) segs[segs.length - 1][1] = Date.now() / 1000;
  return segs;
}
function overlapSec(h, a, b){
  return segsOf(h).reduce((t, [s, e]) => t + Math.max(0, Math.min(e, b) - Math.max(s, a)), 0);
}
function histStatus(h){
  if (h.ended) return h.end_reason === "destroyed" ? ["idle", "Đã huỷ"] : ["idle", "Đã xoá"];
  if (Date.now() / 1000 - h.last_seen < 600) return ["running", "Đang thuê"];
  return ["lost", "Mất liên lạc"];
}
const money = v => v == null ? "–" : "$" + (v >= 100 ? v.toFixed(0) : v.toFixed(2));
const hrs = sec => { const h = sec / 3600; return h >= 10 ? h.toFixed(0) + " giờ" : h >= 1 ? h.toFixed(1) + " giờ" : Math.round(sec / 60) + " phút"; };

function chargesFor(a, b){
  const k = `${a}-${b}`;
  if (S.charges[k] === undefined){
    S.charges[k] = null;
    api(`/api/charges?from=${a}&to=${b}`).then(d => { S.charges[k] = d; if (S.view === "history") render(true); })
      .catch(e => { S.charges[k] = { available: false, reason: e.message }; if (S.view === "history") render(true); });
  }
  return S.charges[k];
}

/** Gộp hoá đơn vast.ai (số tiền thật) với lịch sử agent (tên, run). */
function buildRows(a, b){
  const items = S.hist.items;
  const byInst = new Map(items.filter(h => h.instance_id).map(h => [String(h.instance_id), h]));
  const ch = chargesFor(a, b);
  const rows = [], used = new Set();
  let storage = 0;
  if (ch?.available){
    for (const c of ch.results){
      if (c.end < a || c.start >= b) continue;
      if (c.type === "volume"){ storage += c.amount; continue; }
      const h = c.instance_id ? byInst.get(String(c.instance_id)) : null;
      if (h) used.add(h.id);
      const sec = c.gpu_hours ? c.gpu_hours * 3600 : Math.max(0, Math.min(c.end, b) - Math.max(c.start, a));
      const st = h ? histStatus(h) : (Date.now() / 1000 - c.end < 3600 ? ["running", "Đang thuê"] : ["idle", "Đã huỷ"]);
      rows.push({ key: "v:" + c.source + ":" + c.start, src: "vast", h, c, name: h?.name || c.label || `instance ${c.instance_id}`, instance_id: c.instance_id,
        gpu: h?.gpu_name ? `${h.gpu_count || 1}× ${h.gpu_name}` : null, start: c.start, end: c.end, sec,
        cost: c.amount, exact: true, dph: c.rate ?? h?.dph ?? null, status: st,
        spread: (s0, s1) => { const L = Math.max(1, c.end - c.start); return c.amount * Math.max(0, Math.min(c.end, s1) - Math.max(c.start, s0)) / L; } });
    }
  }
  for (const h of items){
    if (used.has(h.id)) continue;
    const sec = overlapSec(h, a, b);
    if (sec <= 0) continue;
    const segs = segsOf(h);
    rows.push({ key: "a:" + h.id, src: "agent", h, name: h.name || h.id, instance_id: h.instance_id, gpu: h.gpu_name ? `${h.gpu_count || 1}× ${h.gpu_name}` : null,
      start: segs[0][0], end: segs[segs.length - 1][1], sec, cost: h.dph != null ? h.dph * sec / 3600 : null, exact: false,
      dph: h.dph ?? null, status: histStatus(h), spread: (s0, s1) => h.dph != null ? h.dph * overlapSec(h, s0, s1) / 3600 : 0 });
  }
  rows.sort((x, y) => y.start - x.start);
  return { rows, ch, storage };
}

function historyView(){
  if (S.histErr) return `<div class="empty" style="color:var(--err)">${esc(S.histErr)}</div>`;
  if (!S.hist) return `<div class="empty">Đang tải lịch sử…</div>`;
  const [from, to] = periodRange(S.hMode, S.hRef);
  const a = Math.floor(from.getTime() / 1000), b = Math.floor(to.getTime() / 1000);
  const { rows, ch, storage } = buildRows(a, b);
  S.hRows = rows; S.hPeriod = periodLabel(S.hMode, from, to);
  const nSel = rows.filter(r => S.hSel.has(r.key)).length;
  const selBar = rows.length ? `<div class="hctl" style="margin:0 0 8px">
      <span class="sub">${nSel ? `Đã chọn <b style="color:var(--text)">${nSel}</b> máy` : "Tick vào các máy để tổng hợp"}</span>
      <button class="primary sm" id="hSum" ${nSel ? "" : "disabled"}>Tổng hợp${nSel ? ` (${nSel})` : ""}</button>
      ${nSel ? `<button class="sm" id="hClr">Bỏ chọn</button>` : ""}</div>` : "";
  const tot = rows.reduce((t, r) => t + r.sec, 0);
  const priced = rows.filter(r => r.cost != null);
  const cost = priced.reduce((t, r) => t + r.cost, 0) + storage;
  const missing = rows.length - priced.length;
  const est = rows.filter(r => !r.exact && r.cost != null).length;
  const inp = S.hMode === "month" ? `<input type="month" id="hPick" value="${from.getFullYear()}-${String(from.getMonth() + 1).padStart(2, "0")}">`
    : `<input type="date" id="hPick" value="${new Date(S.hRef - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10)}">`;
  const srcNote = ch === null ? `<span class="sub">Đang tải hoá đơn từ vast.ai…</span>`

    : `<span class="sub" style="color:var(--warn)">Không lấy được hoá đơn vast.ai: ${esc(ch?.reason || "")} — đang dùng số ước tính</span>`;

  let chart = "";
  if (S.hMode !== "day" && !(S.hMode === "ndays" && S.hDays === 1)){
    const days = []; for (let t = new Date(from); t < to; t.setDate(t.getDate() + 1)) days.push(new Date(t));
    const vals = days.map(dd => { const s0 = dd.getTime() / 1000, s1 = s0 + 86400; return rows.reduce((t, r) => t + r.spread(s0, s1), 0); });
    const max = Math.max(...vals, 1e-9);
    const lbl = dd => S.hMode === "week" || (S.hMode === "ndays" && days.length <= 10) ? dd.toLocaleDateString("vi-VN", { weekday: "short" }) + " " + dd.getDate() + "/" + (dd.getMonth() + 1) : dd.getDate() + "/" + (dd.getMonth() + 1);
    chart = `<section class="detail" style="margin:0 0 14px"><h3 style="margin-top:0">Chi phí thuê máy theo ngày (USD)</h3>
      <div class="hbars">${vals.map((v, i) => `<div class="b" title="${days[i].toLocaleDateString("vi-VN")}: ${money(v)}"><i style="height:${(v / max * 100).toFixed(1)}%"></i></div>`).join("")}</div>
      <div class="hlabels">${days.map((dd, i) => `<span>${days.length > 10 && i % Math.ceil(days.length / 8) ? "" : lbl(dd)}</span>`).join("")}</div></section>`;
  }

  const dt = t => new Date(t * 1000).toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const table = !rows.length ? `<div class="empty">${ch === null ? "Đang tải…" : "Không có máy nào được thuê trong khoảng này."}</div>` :
    `<section class="detail" style="margin:0"><div class="tw"><table><tr><th style="width:28px"><input type="checkbox" id="hAll" aria-label="Chọn tất cả" ${rows.length && rows.every(r => S.hSel.has(r.key)) ? "checked" : ""}></th><th>Máy</th><th>GPU</th><th>Bắt đầu – kết thúc</th>
      <th class="num">Giờ thuê</th><th class="num">$/giờ</th><th class="num">Chi phí</th><th>Run</th><th>Trạng thái</th><th></th></tr>
    ${rows.map(r => {
      const runs = Object.entries(r.h?.runs || {});
      const [cls, label] = r.status;
      const costCell = r.cost == null ? "–" : r.exact
        ? `<span title="${esc((r.c.items || []).map(i => `${i.type}: $${Number(i.amount).toFixed(3)} — ${i.description}`).join("\n"))}">${money(r.cost)}</span>`
        : `<span title="Ước tính = giá/giờ × thời gian agent thấy máy chạy">≈ ${money(r.cost)}</span>`;
      return `<tr class="${S.hSel.has(r.key) ? "selrow" : ""}"><td><input type="checkbox" data-hsel="${esc(r.key)}" aria-label="Chọn ${esc(r.name)}" ${S.hSel.has(r.key) ? "checked" : ""}></td><td><b>${esc(r.name)}</b><div class="sub mono">${esc(r.instance_id ? "instance " + r.instance_id : r.h?.hostname || "")}</div>
          ${r.h?.note ? `<div class="sub">${esc(r.h.note)}</div>` : ""}${r.src === "vast" && !r.h ? `<div class="sub">chưa có agent</div>` : ""}</td>
        <td>${r.gpu ? esc(r.gpu) : r.exact ? `<span class="sub">${esc(r.c.description).slice(0, 60)}</span>` : "–"}</td>
        <td>${dt(r.start)} – ${label === "Đang thuê" ? "nay" : dt(r.end)}${r.h?.segs?.length > 1 && !r.exact ? `<div class="sub">${r.h.segs.length} đoạn chạy</div>` : ""}</td>
        <td class="num">${hrs(r.sec)}</td>
        <td class="num">${r.exact ? (r.dph != null ? "$" + r.dph.toFixed(3) : "–")
          : `<button class="linkbtn" data-dph="${esc(r.h.id)}" title="Sửa giá/giờ">${r.dph != null ? "$" + r.dph.toFixed(3) : "nhập giá"}</button>`}</td>
        <td class="num">${costCell}</td>
        <td>${runs.length ? `<details><summary class="sub">${runs.length} run</summary>${runs.map(([n, x]) =>
          `<div class="sub mono">${esc(n)} · ${esc(x.status)}</div>`).join("")}</details>` : `<span class="sub">–</span>`}</td>
        <td><span class="badge b-${cls}">${label}</span></td>
        <td>${r.h ? `<button class="sm danger" data-hdel="${esc(r.h.id)}" title="Xoá bản ghi agent">✕</button>` : ""}</td></tr>`;
    }).join("")}</table></div></section>`;

  return `<div class="hctl">
      <div class="tabbar">${[["day", "Ngày"], ["week", "Tuần"], ["month", "Tháng"], ["ndays", "Số ngày"]].map(([k, v]) =>
        `<button data-hmode="${k}" class="${S.hMode === k ? "on" : ""}">${v}</button>`).join("")}</div>
      ${S.hMode === "ndays" ? `<select id="hDays" aria-label="Số ngày">${Array.from({ length: 30 }, (_, i) => i + 1).map(n =>
        `<option value="${n}" ${n === S.hDays ? "selected" : ""}>${n} ngày</option>`).join("")}</select>` : ""}
      <button id="hPrev" aria-label="Kỳ trước">◀</button><span class="period">${periodLabel(S.hMode, from, to)}</span><button id="hNext" aria-label="Kỳ sau">▶</button>
      ${inp}<button id="hToday" class="sm">Hôm nay</button>${srcNote}</div>
    <div class="tiles">
      <div class="tile"><div class="sub">Số máy đã thuê</div><div class="v">${rows.length}</div></div>
      <div class="tile"><div class="sub">Tổng giờ thuê</div><div class="v">${hrs(tot)}</div></div>
      <div class="tile"><div class="sub">Tổng chi phí</div><div class="v">${priced.length || storage ? money(cost) : "–"}</div>
        <div class="sub">${[est ? `${est} máy là ước tính` : "", missing ? `${missing} máy chưa có giá` : ""].filter(Boolean).join(" · ")}</div></div>
      <div class="tile"><div class="sub">Trong đó lưu trữ (volume)</div><div class="v">${ch?.available ? money(storage) : "–"}</div></div>
    </div>${chart}${selBar}${table}${S.sumOpen ? summaryModal() : ""}
    <div class="sub" style="margin-top:10px">Máy có hoá đơn vast.ai hiển thị số tiền thật (GPU + ổ đĩa + băng thông, rê chuột vào số tiền để xem chi tiết). Máy chưa có trong hoá đơn (vd đang chạy) dùng số ước tính "≈". Tên máy và run lấy từ agent nếu máy có cài agent.</div>`;
}

function summaryModal(){
  const sel = (S.hRows || []).filter(r => S.hSel.has(r.key));
  const totSec = sel.reduce((t, r) => t + r.sec, 0);
  const gpuSec = sel.reduce((t, r) => t + r.sec * (r.h?.gpu_count || 1), 0);
  const exact = sel.filter(r => r.exact).reduce((t, r) => t + r.cost, 0);
  const est = sel.filter(r => !r.exact && r.cost != null).reduce((t, r) => t + r.cost, 0);
  const noPrice = sel.filter(r => r.cost == null).length;
  const dt = t => new Date(t * 1000).toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  return `<div class="modal-bg" id="mBg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mT">
    <div class="dhead"><h2 id="mT">Tổng hợp ${sel.length} máy</h2><span class="sub">${esc(S.hPeriod)}</span><span class="sp" style="flex:1"></span>
      <button class="sm" id="mCopy">Copy</button><button class="sm" id="mClose" aria-label="Đóng">✕</button></div>
    <div class="tw"><table><tr><th>#</th><th>Máy</th><th>GPU</th><th>Thời gian</th><th class="num">Giờ</th><th class="num">$/giờ</th><th class="num">Chi phí</th></tr>
      ${sel.map((r, i) => `<tr><td>${i + 1}</td><td><b>${esc(r.name)}</b>${r.instance_id ? `<div class="sub mono">instance ${esc(r.instance_id)}</div>` : ""}</td>
        <td>${esc(r.gpu || "–")}</td><td>${dt(r.start)} – ${r.status[1] === "Đang thuê" ? "nay" : dt(r.end)}</td>
        <td class="num">${(r.sec / 3600).toFixed(1)}</td><td class="num">${r.dph != null ? "$" + r.dph.toFixed(3) : "–"}</td>
        <td class="num">${r.cost == null ? "–" : (r.exact ? "" : "≈ ") + money(r.cost)}</td></tr>`).join("")}
      <tr class="totrow"><td></td><td colspan="3"><b>Tổng cộng</b></td><td class="num"><b>${(totSec / 3600).toFixed(1)}</b></td><td></td>
        <td class="num"><b>${money(exact + est)}</b></td></tr></table></div>
    <div class="tiles" style="margin:14px 0 0">
      <div class="tile"><div class="sub">Tổng tiền</div><div class="v">${money(exact + est)}</div>
        <div class="sub">${est ? `gồm ${money(exact)} theo hoá đơn + ≈ ${money(est)} ước tính` : "theo hoá đơn vast.ai"}${noPrice ? ` · ${noPrice} máy chưa có giá` : ""}</div></div>
      <div class="tile"><div class="sub">Tổng giờ thuê</div><div class="v">${(totSec / 3600).toFixed(1)} giờ</div></div>
      <div class="tile"><div class="sub">Tổng giờ GPU</div><div class="v">${(gpuSec / 3600).toFixed(1)}</div></div>
      <div class="tile"><div class="sub">Trung bình / giờ</div><div class="v">${totSec ? money((exact + est) / (totSec / 3600)) : "–"}</div></div>
    </div></div></div>`;
}
function summaryText(){
  const sel = (S.hRows || []).filter(r => S.hSel.has(r.key));
  const lines = [`Tổng hợp thuê máy vast.ai — ${S.hPeriod}`, ["#", "Máy", "Instance", "GPU", "Giờ", "$/giờ", "Chi phí (USD)"].join("\t")];
  sel.forEach((r, i) => lines.push([i + 1, r.name, r.instance_id || "", r.gpu || "", (r.sec / 3600).toFixed(1),
    r.dph != null ? r.dph.toFixed(3) : "", r.cost != null ? (r.exact ? "" : "~") + r.cost.toFixed(2) : ""].join("\t")));
  const tot = sel.reduce((t, r) => t + (r.cost || 0), 0), h = sel.reduce((t, r) => t + r.sec, 0) / 3600;
  lines.push(["", "Tổng cộng", "", "", h.toFixed(1), "", tot.toFixed(2)].join("\t"));
  return lines.join("\n");
}

function bindHistory(){
  $("#hDays")?.addEventListener("change", e => { S.hDays = +e.target.value; lsSet("vm.hdays", S.hDays); e.target.blur(); render(true); });
  document.querySelectorAll("[data-hsel]").forEach(cb => cb.onchange = () => {
    cb.checked ? S.hSel.add(cb.dataset.hsel) : S.hSel.delete(cb.dataset.hsel); render(true);
  });
  $("#hAll")?.addEventListener("change", e => {
    for (const r of S.hRows || []) e.target.checked ? S.hSel.add(r.key) : S.hSel.delete(r.key);
    render(true);
  });
  $("#hSum")?.addEventListener("click", () => { S.sumOpen = true; render(true); });
  $("#hClr")?.addEventListener("click", () => { S.hSel.clear(); render(true); });
  const close = () => { S.sumOpen = false; render(true); };
  $("#mClose")?.addEventListener("click", close);
  $("#mBg")?.addEventListener("click", e => { if (e.target.id === "mBg") close(); });
  $("#mCopy")?.addEventListener("click", () => navigator.clipboard?.writeText(summaryText()).then(() => toast("Đã copy bảng tổng hợp (dán được vào Excel/Sheets)")));

  document.querySelectorAll("[data-hmode]").forEach(b => b.onclick = () => { S.hMode = b.dataset.hmode; lsSet("vm.hmode", S.hMode); render(true); });
  $("#hPrev")?.addEventListener("click", () => { shiftRef(-1); render(true); });
  $("#hNext")?.addEventListener("click", () => { shiftRef(1); render(true); });
  $("#hToday")?.addEventListener("click", () => { S.hRef = Date.now(); render(true); });
  $("#hPick")?.addEventListener("change", e => {
    const v = e.target.value; if (!v) return;
    const [y, mo, da] = v.split("-").map(Number); S.hRef = new Date(y, mo - 1, da || 1).getTime(); render(true);
  });
  document.querySelectorAll("[data-dph]").forEach(b => b.onclick = async () => {
    const v = prompt("Giá thuê (USD/giờ) cho máy này — xem trên trang Instances của vast.ai:", "");
    if (v === null) return;
    const n = v.trim() === "" ? null : Number(v.replace(",", "."));
    if (n !== null && !(n >= 0)) return toast("Giá không hợp lệ");
    await api("/api/history", { method: "POST", body: JSON.stringify({ id: b.dataset.dph, dph: n }) }).catch(e => toast(e.message));
    loadHistory();
  });
  document.querySelectorAll("[data-hdel]").forEach(b => b.onclick = async () => {
    if (!confirm("Xoá bản ghi lịch sử này?")) return;
    await api("/api/history?id=" + encodeURIComponent(b.dataset.hdel), { method: "DELETE" }).catch(e => toast(e.message));
    loadHistory();
  });
}

// ------------------------------------------------------------ actions
async function sendWatch(){
  const w = S.watch; if (!w) return;
  await api("/api/command", { method: "POST", body: JSON.stringify({ id: w.id, type: "watch", kind: w.kind, target: w.target, lines: w.lines }) }).catch(e => toast(e.message));
}
function bind(){
  $("#bR")?.addEventListener("click", () => { if (S.view === "history"){ S.charges = {}; loadHistory(); } else load(); });
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => {
    S.view = b.dataset.view; lsSet("vm.view", S.view); render(true);
    if (S.view === "history") loadHistory();
  });
  bindHistory();
  $("#bO")?.addEventListener("click", () => { S.token = ""; lsSet("vm.token", ""); render(); });
  $("#bN")?.addEventListener("click", async () => { if ("Notification" in window) await Notification.requestPermission(); render(); });
  document.querySelectorAll(".card").forEach(c => c.onclick = () => {
    if (S.sel !== c.dataset.id){ S.logTab = 0; S.wKind = null; S.wCustom = false; } S.sel = c.dataset.id; lsSet("vm.sel", S.sel); render(); schedule();
  });
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { S.logTab = +b.dataset.tab; render(); });
  document.querySelectorAll("[data-w]").forEach(b => b.onclick = () => startWatch(b.dataset.w, b.dataset.v));
  document.querySelectorAll("[data-kill]").forEach(b => b.onclick = () => kill(+b.dataset.kill));
  $("#wKind")?.addEventListener("change", e => { S.wKind = e.target.value; S.wCustom = false; render(true); });
  $("#wPick")?.addEventListener("change", e => {
    if (e.target.value === "__custom"){ S.wCustom = true; render(true); $("#wTarget")?.focus(); return; }
    if (e.target.value) startWatch($("#wKind").value, e.target.value);
  });
  $("#wGo")?.addEventListener("click", () => {
    const v = $("#wTarget") ? $("#wTarget").value.trim() : $("#wPick")?.value;
    if (v && v !== "__custom") startWatch($("#wKind").value, v);
  });
  $("#wTarget")?.addEventListener("keydown", e => { if (e.key === "Enter") $("#wGo").click(); });
  $("#wStop")?.addEventListener("click", async () => {
    const id = S.watch.id; S.watch = null; render(); schedule();
    await api("/api/command", { method: "POST", body: JSON.stringify({ id, type: "unwatch" }) }).catch(() => {});
  });
  $("#bDel")?.addEventListener("click", async () => {
    if (!confirm("Xoá máy này khỏi dashboard? Nếu agent còn chạy, máy sẽ hiện lại ở lần gửi kế tiếp.")) return;
    await api("/api/machines?id=" + encodeURIComponent(S.sel), { method: "DELETE" }); S.sel = null; load();
  });
  $("#bClr")?.addEventListener("click", async () => { await api("/api/command", { method: "POST", body: JSON.stringify({ type: "clear_events" }) }); load(); });
  bindCharts();
}
async function startWatch(kind, target){
  if (!target) return;
  S.watch = { id: S.sel, kind, target, lines: +($("#wLines")?.value || 200) }; S.logTab = 0; S.wKind = kind; S.wCustom = false;
  document.activeElement?.blur();
  await sendWatch(); render(true); schedule();
  $("#logpre")?.scrollIntoView({ behavior: "smooth", block: "center" });
}
async function kill(pid){
  const sig = prompt(`Gửi tín hiệu tới PID ${pid}?\nTERM (dừng nhẹ), INT (như Ctrl+C) hoặc KILL (ép dừng):`, "TERM");
  if (!sig) return;
  try {
    await api("/api/command", { method: "POST", body: JSON.stringify({ id: S.sel, type: "kill", pid, sig: sig.trim().toUpperCase() }) });
    toast("Đã xếp lệnh — agent sẽ thực hiện ở lần gửi kế tiếp");
  } catch (e){ toast("Lỗi: " + e.message); }
}

document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sumOpen){ S.sumOpen = false; render(true); } });
document.addEventListener("focusout", () => setTimeout(() => { if (S.dirty) render(); }, 0));
render();
if (S.token){ load(); schedule(); if (S.view === "history") loadHistory(); }
</script>
</body>
</html>
