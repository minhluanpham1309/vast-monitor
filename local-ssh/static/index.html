<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vast Monitor</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --line:#e3e6eb; --text:#1b1f24; --muted:#6a7380;
  --accent:#2f6fed; --run:#1f9d55; --idle:#8a94a3; --err:#d64545; --warn:#c98a12;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --logbg:#0f1318; --logtext:#d7dde5;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1216; --panel:#171b21; --line:#272d36; --text:#e6e9ee; --muted:#8b95a3;
    --accent:#5b8ef5; --logbg:#0a0d10; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 12px 0 0;letter-spacing:.2px}
header .sp{flex:1}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--err)}
button.sm{padding:2px 8px;font-size:12px}
select,input,textarea{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 8px}
main{padding:18px 20px;max-width:1500px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--muted)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card .top{display:flex;align-items:center;gap:8px}
.card .name{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--muted);font-size:12px}
.mono{font-family:var(--mono);font-size:12px}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.b-running{background:color-mix(in srgb,var(--run) 15%,transparent);color:var(--run)}
.b-idle{background:color-mix(in srgb,var(--idle) 18%,transparent);color:var(--idle)}
.b-error{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err)}
.b-loading{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.gpu{display:grid;grid-template-columns:22px 1fr 1fr;gap:6px;align-items:center;margin-top:6px;font-size:11px}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.bar.mem>i{background:var(--warn)}
.stats{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--text);font-weight:600}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
section.detail{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.dhead h2{margin:0;font-size:16px}
h3{font-size:13px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:11.5px}
td.cmd{font-family:var(--mono);font-size:11.5px;word-break:break-all;max-width:560px}
td.cmd .child{color:var(--muted)}
.links{display:flex;gap:4px;flex-wrap:wrap}
.logbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.logbox input[type=text]{flex:1;min-width:240px;font-family:var(--mono);font-size:12px}
pre.log{background:var(--logbg);color:var(--logtext);font:12px/1.45 var(--mono);padding:12px;border-radius:8px;
  max-height:520px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:0}
.kv{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px}
.kv div span{color:var(--muted);margin-right:4px}
.events{margin-top:18px}
.events li{font-size:12.5px;margin:3px 0}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:0;width:min(560px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form{padding:18px}
dialog h2{margin:0 0 12px;font-size:16px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f label{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px}
.row .f{flex:1}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
details summary{cursor:pointer;color:var(--muted);font-size:12px;margin-bottom:8px}
.toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:20}
.toast div{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);padding:8px 12px;border-radius:8px;
  box-shadow:0 4px 18px rgba(0,0,0,.15);font-size:13px;max-width:380px}
@media (max-width:640px){ header{padding:10px 14px} main{padding:14px} }
</style>
</head>
<body>
<header>
  <h1>Vast Monitor</h1>
  <button class="primary" id="btnAdd">+ Thêm máy</button>
  <button id="btnRefresh">Làm mới</button>
  <label class="sub">Tự làm mới
    <select id="interval">
      <option value="0">Tắt</option><option value="15">15 giây</option>
      <option value="30" selected>30 giây</option><option value="60">1 phút</option><option value="300">5 phút</option>
    </select>
  </label>
  <span class="sp"></span>
  <button id="btnNotify" title="Báo khi một tiến trình kết thúc">Bật thông báo</button>
</header>

<main>
  <div id="grid" class="grid"></div>
  <div id="detail"></div>
  <div class="events" id="events"></div>
</main>

<dialog id="dlg">
  <form method="dialog" id="frm">
    <h2 id="dlgTitle">Thêm máy</h2>
    <div class="f">
      <label>Dán lệnh SSH từ vast.ai (tự điền IP, port, user)</label>
      <input id="sshcmd" class="mono" placeholder="ssh -p 41234 root@123.45.67.89 -L 8080:localhost:8080">
    </div>
    <div class="row">
      <div class="f" style="flex:2"><label>IP / host</label><input name="host" required class="mono"></div>
      <div class="f"><label>Port</label><input name="port" type="number" value="22" required class="mono"></div>
      <div class="f"><label>User</label><input name="user" value="root" class="mono"></div>
    </div>
    <div class="f"><label>Tên gợi nhớ</label><input name="name" placeholder="vd: 4090 - exp ViSportSent"></div>
    <div class="f"><label>Đường dẫn SSH key trên máy bạn</label><input name="key_path" class="mono" placeholder="~/.ssh/id_ed25519"></div>
    <details>
      <summary>Hoặc dán nội dung private key / passphrase</summary>
      <div class="f"><label>Private key (lưu vào data/keys, quyền 600)</label>
        <textarea name="key_text" rows="4" class="mono" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea></div>
      <div class="f"><label>Passphrase của key (nếu có)</label><input name="passphrase" type="password"></div>
    </details>
    <details>
      <summary>Bộ lọc tiến trình</summary>
      <div class="f"><label>Regex tiến trình cần theo dõi</label><input name="pattern" class="mono"></div>
      <div class="f"><label>Regex loại trừ</label><input name="exclude" class="mono"></div>
    </details>
    <div class="f"><label>Ghi chú</label><input name="note"></div>
    <div class="actions">
      <button type="button" class="danger" id="btnDel" style="margin-right:auto;display:none">Xoá máy</button>
      <button value="cancel" formnovalidate>Huỷ</button>
      <button class="primary" value="ok" id="btnSave">Lưu</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = { machines: [], status: {}, sel: null, defaults: {}, prevPids: {}, events: [],
  log: { kind: null, target: "", lines: 200, follow: true, text: "", meta: "" }, timer: null, logTimer: null };

function lsGet(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

async function api(path, opts = {}){
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

function fmtDur(s){
  if (s == null) return "–";
  s = Math.floor(s);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return `${d}n ${h}g`;
  if (h) return `${h}g ${m}p`;
  if (m) return `${m}p ${s % 60}s`;
  return `${s}s`;
}
function fmtMB(mb){ if (mb == null) return "–"; return mb >= 1024 ? (mb / 1024).toFixed(1) + " GB" : Math.round(mb) + " MB"; }
function fmtBytes(b){ if (b == null) return "–"; if (b < 1024) return b + " B"; if (b < 1048576) return (b / 1024).toFixed(1) + " KB"; return fmtMB(b / 1048576); }
function ago(ts){ if (!ts) return ""; const s = Date.now() / 1000 - ts; return s < 60 ? "vừa xong" : fmtDur(s) + " trước"; }
function pct(a, b){ return b ? Math.min(100, a / b * 100) : 0; }

function toast(msg){
  const el = document.createElement("div"); el.textContent = msg; $("#toast").appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

// ---------------------------------------------------------------- load
async function loadMachines(){
  state.machines = await api("/api/machines");
  if (state.sel && !state.machines.find(m => m.id === state.sel)) state.sel = null;
  render();
}

async function refreshOne(m){
  state.status[m.id] = { ...(state.status[m.id] || {}), loading: true };
  renderGrid();
  let st;
  try { st = await api(`/api/machines/${m.id}/status`); }
  catch (e) { st = { ok: false, error: e.message }; }
  detectFinished(m, st);
  state.status[m.id] = st;
  render();
}
function refreshAll(){ return Promise.all(state.machines.map(refreshOne)); }

function detectFinished(m, st){
  if (!st.ok) return;
  const prev = state.prevPids[m.id];
  const cur = {};
  for (const p of st.procs) if (!p.cmd.startsWith("bash")) cur[p.pid] = p;
  if (prev){
    for (const pid in prev){
      if (!cur[pid] && !prev[pid].isChild){
        const p = prev[pid];
        const msg = `[${m.name}] Tiến trình ${pid} đã kết thúc sau ${fmtDur(p.etime)}`;
        state.events.unshift({ t: Date.now(), msg, cmd: p.cmd });
        toast(msg);
        if ("Notification" in window && Notification.permission === "granted")
          new Notification("Vast Monitor", { body: msg + "\n" + p.cmd.slice(0, 120) });
      }
    }
    state.events = state.events.slice(0, 50);
    lsSet("vm.events", state.events);
  }
  const pidset = new Set(Object.keys(cur).map(Number));
  for (const pid in cur) cur[pid] = { cmd: cur[pid].cmd, etime: cur[pid].etime, isChild: pidset.has(cur[pid].ppid) };
  state.prevPids[m.id] = cur;
}

// ---------------------------------------------------------------- render
function render(){ renderGrid(); renderDetail(); renderEvents(); }

function stateOf(st){
  if (!st || (st.loading && st.ok === undefined)) return ["loading", "Đang kết nối…"];
  if (st.ok === false) return ["error", "Lỗi kết nối"];
  if (st.state === "running") return ["running", "Đang chạy"];
  return ["idle", "Rảnh"];
}

function renderGrid(){
  const g = $("#grid");
  if (!state.machines.length){
    g.innerHTML = `<div class="empty" style="grid-column:1/-1">Chưa có máy nào. Bấm <b>+ Thêm máy</b> và dán lệnh SSH từ vast.ai.</div>`;
    return;
  }
  g.innerHTML = state.machines.map(m => {
    const st = state.status[m.id];
    const [cls, label] = stateOf(st);
    let body = "";
    if (st && st.ok){
      const gpus = (st.gpus || []).map(x => `
        <div class="gpu"><span class="mono">#${esc(x.index)}</span>
          <div class="bar" title="GPU ${x.util ?? "?"}%"><i style="width:${x.util || 0}%"></i></div>
          <div class="bar mem" title="VRAM ${fmtMB(x.mem_used)} / ${fmtMB(x.mem_total)}"><i style="width:${pct(x.mem_used, x.mem_total)}%"></i></div>
        </div>`).join("");
      const roots = st.procs.filter(p => !st.procs.some(q => q.pid === p.ppid));
      body = `${gpus ? `<div class="sub" style="margin-top:8px">${esc(st.gpus[0].name)} × ${st.gpus.length} &nbsp;·&nbsp; util / VRAM</div>${gpus}` : `<div class="sub" style="margin-top:8px">Không có GPU (nvidia-smi)</div>`}
        <div class="stats"><span>Tiến trình <b>${roots.length}</b></span>
          <span>tmux <b>${st.tmux.length}</b></span>
          <span>Uptime <b>${fmtDur(st.uptime_s)}</b></span>
          <span>${st.loading ? "đang làm mới…" : ago(st.fetched_at)}</span></div>`;
    } else if (st && st.ok === false){
      body = `<div class="sub" style="margin-top:8px;color:var(--err)">${esc(st.error)}</div>`;
    }
    return `<div class="card ${state.sel === m.id ? "sel" : ""}" data-id="${m.id}">
      <div class="top"><span class="name">${esc(m.name)}</span><span class="badge b-${cls}">${label}</span></div>
      <div class="sub mono">${esc(m.user)}@${esc(m.host)}:${esc(m.port)}</div>${body}</div>`;
  }).join("");
  g.querySelectorAll(".card").forEach(c => c.onclick = () => select(c.dataset.id));
}

function select(id, scroll = true){
  if (state.sel !== id){ state.log = { kind: null, target: "", lines: 200, follow: true, text: "", meta: "" }; stopLogTimer(); }
  state.sel = id; render();
  if (scroll) $("#detail").scrollIntoView({ behavior: "smooth", block: "start" });
}

function orderTree(procs){
  const ids = new Set(procs.map(p => p.pid)), out = [];
  const kids = p => procs.filter(q => q.ppid === p.pid);
  const walk = (p, d) => { out.push({ ...p, depth: d }); kids(p).forEach(k => walk(k, d + 1)); };
  procs.filter(p => !ids.has(p.ppid)).forEach(p => walk(p, 0));
  return out;
}

function renderDetail(){
  const box = $("#detail");
  const m = state.machines.find(x => x.id === state.sel);
  if (!m){ box.innerHTML = ""; return; }
  const st = state.status[m.id] || {};
  const keepScroll = $("#logpre")?.scrollTop;
  let html = `<section class="detail">
    <div class="dhead"><h2>${esc(m.name)}</h2><span class="sub mono">${esc(m.user)}@${esc(m.host)} -p ${esc(m.port)}</span>
      <span class="sp" style="flex:1"></span>
      <button class="sm" id="dRefresh">Làm mới</button><button class="sm" id="dEdit">Sửa</button>
      <button class="sm" id="dCopy">Copy lệnh SSH</button></div>`;
  if (m.note) html += `<div class="sub" style="margin-bottom:8px">${esc(m.note)}</div>`;

  if (st.ok){
    const mem = st.mem ? `${fmtMB(st.mem.used)} / ${fmtMB(st.mem.total)}` : "–";
    html += `<div class="kv">
      <div><span>Host</span>${esc(st.hostname)}</div>
      <div><span>Load</span>${(st.load || []).join(" ")} ${st.ncpu ? `(${st.ncpu} CPU)` : ""}</div>
      <div><span>RAM</span>${mem}</div>
      ${st.disks.map(d => `<div><span>Disk ${esc(d.mount)}</span>${fmtMB(d.used)} / ${fmtMB(d.total)}</div>`).join("")}
      <div><span>Lấy dữ liệu</span>${st.elapsed_ms} ms, ${ago(st.fetched_at)}</div></div>`;

    if (st.gpus.length){
      html += `<h3>GPU</h3><table><tr><th>#</th><th>Tên</th><th>Util</th><th>VRAM</th><th>Nhiệt</th><th>Công suất</th></tr>
        ${st.gpus.map(x => `<tr><td>${esc(x.index)}</td><td>${esc(x.name)}</td><td>${x.util ?? "–"}%</td>
          <td>${fmtMB(x.mem_used)} / ${fmtMB(x.mem_total)}</td><td>${x.temp ?? "–"}°C</td>
          <td>${x.power != null ? Math.round(x.power) : "–"} / ${x.power_limit != null ? Math.round(x.power_limit) : "–"} W</td></tr>`).join("")}</table>`;
    }

    const procs = orderTree(st.procs);
    html += `<h3>Tiến trình (${procs.length})</h3>`;
    if (!procs.length) html += `<div class="sub">Không có tiến trình nào khớp bộ lọc.</div>`;
    else html += `<table><tr><th>PID</th><th>Chạy được</th><th>CPU</th><th>RAM</th><th>GPU</th><th>Lệnh / thư mục</th><th></th></tr>
      ${procs.map(p => `<tr>
        <td class="mono">${p.pid}</td><td>${fmtDur(p.etime)}</td><td>${p.cpu}%</td><td>${fmtMB(p.rss_mb)}</td>
        <td>${p.gpu_mem != null ? fmtMB(p.gpu_mem) + (p.gpu_ids.length ? ` <span class="sub">#${p.gpu_ids.join(",")}</span>` : "") : "–"}</td>
        <td class="cmd"><span class="${p.depth ? "child" : ""}">${"&nbsp;&nbsp;↳ ".repeat(p.depth ? 1 : 0)}${esc(p.cmd)}</span>
          ${p.cwd ? `<div class="sub">📁 ${esc(p.cwd)}</div>` : ""}
          ${p.stdout && !p.log ? `<div class="sub">stdout → ${esc(p.stdout)}</div>` : ""}</td>
        <td><div class="links">
          ${p.log ? `<button class="sm" data-act="log" data-v="${esc(p.log)}">Log</button>` : ""}
          ${p.tmux ? `<button class="sm" data-act="tmux" data-v="${esc(p.tmux)}">tmux ${esc(p.tmux)}</button>` : ""}
          <button class="sm danger" data-act="kill" data-v="${p.pid}">Dừng</button></div></td></tr>`).join("")}</table>`;

    if (st.tmux.length || st.screens.length){
      html += `<h3>Phiên tmux / screen</h3><div class="links">
        ${st.tmux.map(t => `<button class="sm" data-act="tmux" data-v="${esc(t.name)}">${esc(t.name)} · ${t.windows} cửa sổ${t.attached ? " · đang attach" : ""}</button>`).join("")}
        ${st.screens.map(s => `<span class="badge b-idle">screen ${esc(s)}</span>`).join("")}</div>`;
    }
  } else if (st.ok === false){
    html += `<div style="color:var(--err)">${esc(st.error)}</div>`;
  } else html += `<div class="sub">Đang kết nối…</div>`;

  const L = state.log;
  html += `<h3>Xem log</h3>
    <div class="logbox">
      <select id="logKind"><option value="file" ${L.kind !== "tmux" ? "selected" : ""}>File</option><option value="tmux" ${L.kind === "tmux" ? "selected" : ""}>tmux pane</option></select>
      <input type="text" id="logTarget" placeholder="/workspace/exp/train.log  hoặc  tên-phiên-tmux" value="${esc(L.target)}">
      <select id="logLines">${[100, 200, 500, 1000, 3000].map(n => `<option ${n === L.lines ? "selected" : ""}>${n}</option>`).join("")}</select>
      <label class="sub"><input type="checkbox" id="logFollow" ${L.follow ? "checked" : ""}> tự cập nhật 5s</label>
      <button class="sm primary" id="logGo">Xem</button>
    </div>
    ${L.meta ? `<div class="sub" style="margin-bottom:6px">${esc(L.meta)}</div>` : ""}
    <pre class="log" id="logpre">${L.text ? esc(L.text) : '<span style="opacity:.5">Chọn "Log" hoặc "tmux" ở bảng trên, hoặc nhập đường dẫn file log.</span>'}</pre>
  </section>`;
  box.innerHTML = html;

  const pre = $("#logpre");
  if (keepScroll != null && !L.stick) pre.scrollTop = keepScroll; else pre.scrollTop = pre.scrollHeight;
  L.stick = false;

  $("#dRefresh").onclick = () => refreshOne(m);
  $("#dEdit").onclick = () => openDialog(m);
  $("#dCopy").onclick = () => {
    const cmd = `ssh -p ${m.port} ${m.user}@${m.host}${m.key_path ? " -i " + m.key_path : ""}`;
    navigator.clipboard?.writeText(cmd).then(() => toast("Đã copy: " + cmd));
  };
  box.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const v = b.dataset.v;
    if (b.dataset.act === "log") openLog("file", v);
    if (b.dataset.act === "tmux") openLog("tmux", v);
    if (b.dataset.act === "kill") killProc(m, +v);
  });
  $("#logGo").onclick = () => openLog($("#logKind").value, $("#logTarget").value.trim());
  $("#logTarget").onkeydown = e => { if (e.key === "Enter") $("#logGo").click(); };
  $("#logLines").onchange = e => { state.log.lines = +e.target.value; if (state.log.target) fetchLog(true); };
  $("#logFollow").onchange = e => { state.log.follow = e.target.checked; startLogTimer(); };
}

function renderEvents(){
  const ev = state.events;
  $("#events").innerHTML = ev.length ? `<h3>Tiến trình đã kết thúc</h3><ul>${ev.slice(0, 15).map(e =>
    `<li><span class="sub">${new Date(e.t).toLocaleString("vi-VN")}</span> — ${esc(e.msg)} <span class="sub mono">${esc(e.cmd.slice(0, 100))}</span></li>`).join("")}</ul>
    <button class="sm" id="clrEv">Xoá lịch sử</button>` : "";
  const c = $("#clrEv"); if (c) c.onclick = () => { state.events = []; lsSet("vm.events", []); renderEvents(); };
}

// ---------------------------------------------------------------- log
function openLog(kind, target){
  if (!target) return;
  Object.assign(state.log, { kind, target, text: "Đang tải…", meta: "" });
  renderDetail(); fetchLog(true); startLogTimer();
  $("#logpre")?.scrollIntoView({ behavior: "smooth", block: "center" });
}
async function fetchLog(stick){
  const L = state.log, id = state.sel;
  if (!L.target || !id) return;
  const q = new URLSearchParams({ lines: L.lines });
  let url;
  if (L.kind === "tmux"){ q.set("target", L.target); url = `/api/machines/${id}/tmux?${q}`; }
  else { q.set("path", L.target); url = `/api/machines/${id}/tail?${q}`; }
  const pre = $("#logpre");
  const atBottom = pre ? pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40 : true;
  let r;
  try { r = await api(url); } catch (e) { r = { ok: false, error: e.message }; }
  if (state.sel !== id || state.log.target !== L.target) return;
  L.text = r.ok ? (r.text || "(trống)") : "Lỗi: " + r.error;
  L.meta = r.ok && r.mtime ? `Sửa lần cuối ${ago(r.mtime)} · ${fmtBytes(r.size)}` +
    (Date.now() / 1000 - r.mtime > 1800 ? " · ⚠ log không cập nhật hơn 30 phút" : "") : (L.kind === "tmux" ? `tmux ${L.target}` : "");
  L.stick = stick || atBottom;
  renderDetail();
}
function stopLogTimer(){ clearInterval(state.logTimer); state.logTimer = null; }
function startLogTimer(){
  stopLogTimer();
  if (state.log.follow && state.log.target) state.logTimer = setInterval(() => fetchLog(false), 5000);
}

async function killProc(m, pid){
  const sig = prompt(`Gửi tín hiệu tới PID ${pid} trên ${m.name}?\nNhập TERM (dừng nhẹ), INT (như Ctrl+C) hoặc KILL (ép dừng):`, "TERM");
  if (!sig) return;
  const r = await api(`/api/machines/${m.id}/kill`, { method: "POST", body: JSON.stringify({ pid, sig: sig.trim().toUpperCase() }) })
    .catch(e => ({ ok: false, error: e.message }));
  toast(r.ok ? `Đã gửi ${sig.toUpperCase()} tới ${pid}` : "Lỗi: " + r.error);
  setTimeout(() => refreshOne(m), 1500);
}

// ---------------------------------------------------------------- dialog
let editing = null;
function openDialog(m){
  editing = m || null;
  const f = $("#frm"); f.reset();
  $("#dlgTitle").textContent = m ? "Sửa máy" : "Thêm máy";
  $("#btnDel").style.display = m ? "" : "none";
  $("#sshcmd").value = "";
  f.pattern.placeholder = state.defaults.pattern || "";
  f.exclude.value = m ? (m.exclude ?? state.defaults.exclude) : state.defaults.exclude;
  if (m){
    for (const k of ["host", "port", "user", "name", "key_path", "pattern", "note"]) f[k].value = m[k] ?? "";
    f.key_text.placeholder = m.has_pasted_key ? "(đã lưu key — để trống nếu không đổi)" : "-----BEGIN OPENSSH PRIVATE KEY-----";
  } else f.key_path.value = lsGet("vm.lastKey", "");
  $("#dlg").showModal();
}
$("#sshcmd").addEventListener("input", e => {
  const s = e.target.value, f = $("#frm");
  const p = s.match(/-p\s*(\d+)/); if (p) f.port.value = p[1];
  const uh = s.match(/([\w.\-]+)@([\w.\-]+)/); if (uh){ f.user.value = uh[1]; f.host.value = uh[2]; }
  const i = s.match(/-i\s+(\S+)/); if (i) f.key_path.value = i[1];
  if (!uh){ const h = s.trim().match(/^(\d+\.\d+\.\d+\.\d+)(?::(\d+))?$/); if (h){ f.host.value = h[1]; if (h[2]) f.port.value = h[2]; } }
});
$("#frm").addEventListener("submit", async e => {
  if (e.submitter?.value !== "ok") return;
  e.preventDefault();
  const f = e.target;
  const body = { host: f.host.value, port: +f.port.value, user: f.user.value, name: f.name.value, key_path: f.key_path.value,
    key_text: f.key_text.value, pattern: f.pattern.value, exclude: f.exclude.value, note: f.note.value };
  if (f.passphrase.value) body.passphrase = f.passphrase.value;
  if (!body.key_path && !body.key_text && !(editing && editing.has_pasted_key) &&
      !confirm("Chưa có SSH key — sẽ thử dùng ssh-agent / key mặc định. Tiếp tục?")) return;
  try {
    const m = editing ? await api(`/api/machines/${editing.id}`, { method: "PUT", body: JSON.stringify(body) })
                      : await api("/api/machines", { method: "POST", body: JSON.stringify(body) });
    if (body.key_path) lsSet("vm.lastKey", body.key_path);
    $("#dlg").close();
    await loadMachines();
    state.sel = m.id;
    refreshOne(state.machines.find(x => x.id === m.id));
  } catch (err) { alert("Lỗi: " + err.message); }
});
$("#btnDel").onclick = async () => {
  if (!editing || !confirm(`Xoá máy "${editing.name}"?`)) return;
  await api(`/api/machines/${editing.id}`, { method: "DELETE" });
  delete state.status[editing.id];
  $("#dlg").close(); loadMachines();
};

// ---------------------------------------------------------------- wiring
$("#btnAdd").onclick = () => openDialog(null);
$("#btnRefresh").onclick = refreshAll;
$("#interval").value = lsGet("vm.interval", "30");
$("#interval").onchange = e => { lsSet("vm.interval", e.target.value); schedule(); };
function schedule(){
  clearInterval(state.timer);
  const s = +$("#interval").value;
  if (s) state.timer = setInterval(() => { if (!document.hidden) refreshAll(); }, s * 1000);
}
function updNotifyBtn(){
  const b = $("#btnNotify");
  if (!("Notification" in window)){ b.style.display = "none"; return; }
  b.textContent = Notification.permission === "granted" ? "🔔 Thông báo đang bật" : "Bật thông báo";
}
$("#btnNotify").onclick = async () => { if ("Notification" in window) await Notification.requestPermission(); updNotifyBtn(); };

(async () => {
  state.events = lsGet("vm.events", []);
  state.defaults = await api("/api/defaults");
  updNotifyBtn();
  await loadMachines();
  if (state.machines.length) select(state.machines[0].id, false);
  refreshAll(); schedule();
})();
</script>
